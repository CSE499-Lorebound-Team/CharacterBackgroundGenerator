name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A newer push to the same PR cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job names are the required status checks for branch protection (P0-14).
  # No paths filters: skipped required checks would block merges.
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Lorebound.slnx

      - run: dotnet build Lorebound.slnx --no-restore --configuration Release

      # Database tests start a Postgres container via Testcontainers; the
      # ubuntu runner has Docker.
      - run: dotnet test Lorebound.slnx --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check every model change has a migration
        # The API refuses to start without a connection string; this check
        # never connects, so a placeholder is enough.
        env:
          ConnectionStrings__DefaultConnection: Host=unused;Database=unused
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project api --no-build --configuration Release

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
